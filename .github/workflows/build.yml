name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find the Gradle project folder
        id: findroot
        run: |
          PROJECT_DIR=$(dirname "$(find . -maxdepth 4 -name settings.gradle | head -n 1)")
          echo "Found project dir: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        working-directory: ${{ steps.findroot.outputs.dir }}
        run: chmod +x gradlew || true

      - name: Generate Gradle wrapper (if missing)
        working-directory: ${{ steps.findroot.outputs.dir }}
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
            chmod +x gradlew
          fi

      - name: Build debug APK
        working-directory: ${{ steps.findroot.outputs.dir }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmanRemote-debug-apk
          path: ${{ steps.findroot.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
